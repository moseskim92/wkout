<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A tiny workout log for a group of friends." />
    <title>Workout Log</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232550d8'/%3E%3Cpath d='M6 13h3v6H6zm17 0h3v6h-3zM9 11h3v10H9zm11 0h3v10h-3zM12 15h8v2h-8z' fill='white'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect class="bar" x="2" y="14.5" width="28" height="3" rx="1.5" />
          <rect class="plate" x="6" y="7" width="4" height="18" rx="1.5" />
          <rect class="plate" x="22" y="7" width="4" height="18" rx="1.5" />
          <rect class="plate" x="10.5" y="10" width="2.5" height="12" rx="1" />
          <rect class="plate" x="19" y="10" width="2.5" height="12" rx="1" />
        </svg>
        <span>Workout Log</span>
      </h1>
      <button id="switch-user" class="chip user-chip" type="button" hidden title="Switch user">
        <span class="who-name"></span><span class="muted" aria-hidden="true"> ▾</span>
        <span class="sr-only">(switch user)</span>
      </button>
    </header>

    <main class="container">
      <section id="who" class="who" hidden></section>
      <div id="app" hidden>
        <div id="view" class="view"></div>
      </div>
      <footer class="footer">
        <span id="mode-badge" class="badge local" hidden>Local mode (data stays on this device)</span>
      </footer>
    </main>

    <nav id="tabbar" class="tabbar" aria-label="Sections" hidden>
      <button type="button" data-tab="log">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></span>
        <span>Log</span>
      </button>
      <button type="button" data-tab="history">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /></svg></span>
        <span>History</span>
      </button>
      <button type="button" data-tab="progress">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9" /></svg></span>
        <span>Progress</span>
      </button>
      <button type="button" data-tab="feed">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3" /><circle cx="17" cy="10" r="2.5" /><path d="M3 19c0-3 3-5 6-5s6 2 6 5M15 19c0-2 1.5-4 4-4 1.5 0 2 .5 2 .5" /></svg></span>
        <span>Feed</span>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <noscript><p class="container">This app needs JavaScript.</p></noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
